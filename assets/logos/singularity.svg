<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="singGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#a855f7;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="60" fill="url(#singGrad)">
    <animate attributeName="r" values="58;62;58" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3" stroke-dasharray="5 5">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2" stroke-dasharray="3 7">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="105" font-family="Arial" font-size="14" font-weight="900" text-anchor="middle" fill="white">AI</text>
  <text x="100" y="175" font-family="Arial" font-size="14" font-weight="800" text-anchor="middle" fill="#a855f7">SINGULARITY</text>
</svg>