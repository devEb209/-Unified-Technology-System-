name: Käirōs Net Manager - Build APK

on:
  push:
    branches: [ "arena/01a05f8a-unified-technology-system" ]
    paths: [ "kairos-net-manager/**", ".github/workflows/kairos-apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairos-net-manager
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/KairosNetManager-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/KairosNetManager.apk || true
          ls -lh out

      - name: Upload APK (privado ao repositório)
        uses: actions/upload-artifact@v4
        with:
          name: KairosNetManager-APK
          path: kairos-net-manager/out/*.apk
          retention-days: 90
