<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KÄIRŌS Receptor</title>
    <link rel="icon" href="/assets/kairos-icon.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="receiver-body">
    <img src="/assets/kairos-icon.png" alt="" style="width: 96px; height: 96px; border-radius: 24px; margin-bottom: 18px" />
    <div class="tag">RECEPTOR DE TELA</div>
    <div class="brand" style="margin-top: 8px">KÄIRŌS</div>
    <p class="hint" id="status">Ligando ao hub…</p>
    <div class="pair-code" id="code">••••••</div>
    <p class="hint">Digite este código no celular em Ajustes → Emparelhar.</p>
    <p class="hint" id="who"></p>
    <video id="castVideo" autoplay playsinline></video>
    <img id="castImg" alt="cast" />
    <script type="module" src="/js/receiver.js"></script>
  </body>
</html>
